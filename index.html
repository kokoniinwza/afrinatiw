<style>
:root{--bg:#09090a;--fg:#e6e6e6;--dim:#8a8a8a;--faint:#4d4d4d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:'JetBrains Mono',ui-monospace,monospace}
body{min-height:100vh;padding:56px 24px 80px}
a{color:inherit;text-decoration:none}
button{background:none;border:0;color:inherit;font:inherit;cursor:pointer}
.wrap{max-width:1090px;margin:0 auto}

/* hero */
.hero{display:grid;grid-template-columns:314px 1fr;gap:36px;align-items:center}
#avatar{width:256px;height:auto;margin-left:19px;display:block;filter:grayscale(1)}
.id{display:flex;align-items:center;gap:36px}
.pfp{width:131px;height:131px;border-radius:50%;object-fit:cover;flex:none;border:1px solid #6b3b3b;border-radius:6px}
h1{font-size:26px;font-weight:400;color:#dcdcdc;letter-spacing:.02em;white-space:nowrap}
h1 b{font-family:'Space Mono',monospace;font-weight:700;color:#fff;margin-left:.35em}
.sub{margin-top:10px;font-size:15px;color:var(--dim)}
.links{display:flex;gap:18px;margin-top:16px}
.links a,.status svg{color:#6f6f6f}
.links a:hover{color:#fff}
.links svg{width:22px;height:22px;fill:currentColor;display:block}
.status{margin:38px 0 0 36px;display:grid;gap:12px;font-size:14px}
.status div{display:flex;align-items:center;gap:14px}
.status svg{width:18px;height:18px;fill:currentColor;flex:none}
.status i{font-style:normal;color:#6b6b6b}
.dnd{color:#b08585}.on{color:#8fae8f}.off{color:#555}

/* lower */
.lower{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:64px;align-items:start}
.left{display:grid;min-height:238px}
.left>section{grid-area:1/1;transition:opacity .35s}
.scopes-on .quotes{opacity:0;pointer-events:none}
.left .scopesbox{opacity:0;pointer-events:none}
.scopes-on .scopesbox{opacity:1;pointer-events:auto}

.quotes{max-height:238px;overflow-y:auto;padding-right:16px;scrollbar-width:thin;scrollbar-color:#3a3a3a transparent;
 -webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
.quotes::-webkit-scrollbar{width:2px}.quotes::-webkit-scrollbar-thumb{background:#3a3a3a}
.q{margin-bottom:24px}
.q p{font-style:italic;font-size:14px;line-height:1.55;color:#bdbdbd}
.q .by{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:#6e6e6e}
.q .by em{width:16px;height:16px;border-radius:50%;flex:none}
.q .tr{margin-left:auto;color:#555}.q .tr:hover{color:#aaa}
.q small{display:block;margin-top:6px;font-size:12px;color:#444}

.scopesbox{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 14px;align-content:start}
.scope canvas{width:100%;height:42px;display:block}
.scope span{display:block;margin-top:6px;font-size:12px;color:#3d3d3d;letter-spacing:.04em;transition:color .15s}

/* badges */
.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}
.b{width:96px;height:34px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:11px;line-height:1;white-space:nowrap}
.b1{background:linear-gradient(120deg,#6a3df0,#37c9ff 60%,#8a5cff);color:#2ef0ff;font:italic 900 20px/1 'JetBrains Mono';text-shadow:1px 1px 0 #1b0c5a}
.b2{background:repeating-conic-gradient(#3b3fd2 0 25%,#7a74ff 0 50%) 0 0/10px 10px;color:#ff4f6b;font:700 9px 'JetBrains Mono';text-shadow:1px 1px #000}
.b3{background:#000;color:#fff;font:14px 'Silkscreen',monospace;letter-spacing:2px}
.b4{background:#e8503f;color:#ffffff70;font:9px 'JetBrains Mono'}
.b5{background:#2b2bb0;color:#fff;font:700 12px 'JetBrains Mono'}
.b6{background:radial-gradient(#111 30%,transparent 32%) 0 0/4px 4px,#f06a2a}
.b7{background:#eee;color:#222;font:700 9px 'JetBrains Mono'}
.b7::after{content:"";width:5px;height:9px;background:#000;margin-left:3px}
.b8{background:linear-gradient(#6c4bd0,#2a1b66);color:#fff;font:10px 'JetBrains Mono';border:1px solid #9b86ff}
.b9{background:#0b0b0b;color:#fff;font:italic 22px/1 'Brush Script MT',cursive;letter-spacing:-1px;text-shadow:2px 2px #555}
.b10{background:linear-gradient(90deg,#000,#1a1a1a);color:#fff;font:700 16px 'JetBrains Mono'}
.b11{background:#000;color:#fff;font:19px 'Silkscreen',monospace}

.b:hover{filter:brightness(1.25)}

.ctl{display:flex;gap:16px;color:#8a8a8a;align-self:flex-start}
.ctl svg{width:20px;height:20px;fill:currentColor;display:block}
.ctl button.act{color:#fff}
.prog{display:flex;align-items:center;gap:16px;margin-top:14px;padding-left:46px;color:#7a7a7a;font-size:14px}
.track{flex:1;height:14px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.track div{width:100%;height:2px;background:#2a2a2a;position:relative}
.track div i{position:absolute;left:0;top:0;bottom:0;width:0;background:#9a9a9a}
.queue{display:none;margin:12px 0 0 46px;border-left:1px solid #2a2a2a;padding-left:12px;font-size:13px;color:#888}
.queue.show{display:block}.queue li{list-style:none;padding:3px 0;cursor:pointer}.queue li.cur{color:#fff}

<script>
/* ===== แก้ตรงนี้ได้เลย ===== */
const TRACKS=[{title:'Natural Disaster',artist:'Enon',src:'music/natural-disaster.mp3'}];
const QUOTES=[
 {t:'your avatar and discord profile avatar are the same furry',by:'Peter, 2026',c:'#8a4b3a'},
 {t:'lets play fargo souls no wiki',by:'Lucifur, 2026',c:'#b8863c'},
 {t:'Правила безопасности побудили меня заговорить по-русски. Прошу прощения. [sic]',en:'The safety rules made me start speaking Russian. I apologize. [sic]',by:'GPT-4o, 2026',c:'#d8d8d8',note:'still have no idea what caused this'}
];
/* ========================= */

const $=s=>document.querySelector(s),audio=$('#audio');

/* quotes */
$('#quotes').innerHTML=QUOTES.map((q,i)=>`<div class="q"><p data-i="${i}">“${q.t}”</p><div class="by"><em style="background:${q.c}"></em>${q.by}${q.en?`<button class="tr" data-i="${i}">Translate Text</button>`:''}</div>${q.note?`<small>${q.note}</small>`:''}</div>`).join('');
$('#quotes').addEventListener('click',e=>{const b=e.target.closest('.tr');if(!b)return;const q=QUOTES[b.dataset.i],p=b.closest('.q').querySelector('p');
 const en=p.dataset.en=p.dataset.en?'':'1';p.textContent='“'+(en?q.en:q.t)+'”';b.textContent=en?'Show original':'Translate Text'});

/* scopes: PCM 1-15 */
const N=15,sc=$('#scopes'),cvs=[],lbl=[];
for(let i=0;i<N;i++){sc.insertAdjacentHTML('beforeend',`<div class="scope"><canvas></canvas><span>PCM ${i+1}</span></div>`)}
sc.querySelectorAll('canvas').forEach(c=>cvs.push(c));sc.querySelectorAll('span').forEach(s=>lbl.push(s));
const lvl=new Float32Array(N),peak=new Float32Array(N).fill(.1);
let ctx,ans=[],bufs=[],raf=0,playing=false;

function initAudio(){
 if(ctx)return;
 ctx=new(window.AudioContext||window.webkitAudioContext)();
 const src=ctx.createMediaElementSource(audio);src.connect(ctx.destination);
 const mute=ctx.createGain();mute.gain.value=0;mute.connect(ctx.destination);
 for(let i=0;i<N;i++){
  const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=50*Math.pow(200,i/(N-1));bp.Q.value=4;
  const an=ctx.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=0;
  src.connect(bp);bp.connect(an);an.connect(mute);ans.push(an);bufs.push(new Float32Array(1024));
 }
}
function frame(){
 const dpr=window.devicePixelRatio||1;let alive=false;
 for(let i=0;i<N;i++){
  const c=cvs[i],w=c.clientWidth*dpr|0,h=c.clientHeight*dpr|0;
  if(c.width!==w||c.height!==h){c.width=w;c.height=h}
  const g=c.getContext('2d'),d=bufs[i];
  let rms=0;
  if(playing&&ans[i]){ans[i].getFloatTimeDomainData(d);let s=0,m=0;for(let k=0;k<d.length;k++){s+=d[k]*d[k];m=Math.max(m,Math.abs(d[k]))}
   rms=Math.sqrt(s/d.length);peak[i]=Math.max(peak[i]*.995,m,.08)}
  lvl[i]+=(rms-lvl[i])*.12;
  const act=Math.min(1,lvl[i]*45);if(lvl[i]>.0005)alive=true;
  lbl[i].style.color=`rgb(${61+act*100|0},${61+act*100|0},${61+act*100|0})`;
  g.clearRect(0,0,w,h);g.lineWidth=1.3*dpr;g.lineJoin='round';
  g.strokeStyle=`rgba(225,225,225,${.22+act*.7})`;g.beginPath();
  let st=0;if(playing&&rms>.002){for(let k=1;k<500;k++){if(d[k-1]<0&&d[k]>=0){st=k;break}}}
  const len=420,gain=.85/peak[i];
  for(let k=0;k<len;k++){
   const v=playing&&rms>.002?Math.max(-1,Math.min(1,d[st+k]*gain)):0;
   const x=k/(len-1)*w,y=h/2-v*h*.46;k?g.lineTo(x,y):g.moveTo(x,y);
  }
  g.stroke();
 }
 raf=(playing||alive)?requestAnimationFrame(frame):0;
}
const kick=()=>{if(!raf)raf=requestAnimationFrame(frame)};
frame();

/* player */
const ICON={play:'<path d="M7 4.500v15l13-7.500z"/>',pause:'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>'};
let cur=0;
function load(i){
 cur=(i+TRACKS.length)%TRACKS.length;const t=TRACKS[cur];
 audio.src=t.src;$('#t').textContent=t.title;$('#a').textContent=t.artist;
 $('#queue').querySelectorAll('li').forEach((li,k)=>li.classList.toggle('cur',k===cur));
 if('mediaSession'in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,artwork:[{src:'profile.jpg'}]});
}
$('#queue').innerHTML=TRACKS.map((t,i)=>`<li>${t.title} — ${t.artist}</li>`).join('');
$('#queue').addEventListener('click',e=>{const li=e.target.closest('li');if(li){load([...$('#queue').children].indexOf(li));toggle(true)}});
function setIco(){$('#ico').innerHTML=playing?ICON.pause:ICON.play}
async function toggle(force){
 initAudio();if(ctx.state==='suspended')await ctx.resume();
 const want=force===undefined?audio.paused:force;
 try{want?await audio.play():audio.pause()}catch(e){$('#a').textContent='missing file: '+TRACKS[cur].src}
}
audio.addEventListener('play',()=>{playing=true;setIco();$('#left').classList.add('scopes-on');$('#scopeBtn').classList.add('act');kick()});
audio.addEventListener('pause',()=>{playing=false;setIco();kick()});
audio.addEventListener('ended',()=>{load(cur+1);toggle(true)});
audio.addEventListener('error',()=>{$('#a').textContent='missing file: '+TRACKS[cur].src});
$('#play').onclick=()=>toggle();
$('#prev').onclick=()=>{if(audio.currentTime>3)audio.currentTime=0;else{load(cur-1);toggle(true)}};
$('#next').onclick=()=>{load(cur+1);toggle(true)};
$('#scopeBtn').onclick=e=>{const on=$('#left').classList.toggle('scopes-on');e.currentTarget.classList.toggle('act',on);kick()};
$('#listBtn').onclick=()=>$('#queue').classList.toggle('show');

const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
function upd(){$('#fill').style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+'%';$('#time').textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration)}
['timeupdate','loadedmetadata','durationchange'].forEach(ev=>audio.addEventListener(ev,upd));
const tr=$('#track');let drag=false;
const seek=e=>{const r=tr.getBoundingClientRect();if(audio.duration)audio.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*audio.duration};
tr.addEventListener('pointerdown',e=>{drag=true;tr.setPointerCapture(e.pointerId);seek(e)});
tr.addEventListener('pointermove',e=>drag&&seek(e));
tr.addEventListener('pointerup',()=>drag=false);

if('mediaSession'in navigator){const m=navigator.mediaSession;m.setActionHandler('play',()=>toggle(true));m.setActionHandler('pause',()=>toggle(false));m.setActionHandler('previoustrack',()=>$('#prev').click());m.setActionHandler('nexttrack',()=>$('#next').click())}
load(0);setIco();
</script>

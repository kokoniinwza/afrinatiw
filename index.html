<style>
:root{--bg:#09090a;--fg:#e6e6e6;--dim:#8a8a8a;--faint:#4d4d4d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:'JetBrains Mono',ui-monospace,monospace}
body{min-height:100vh;padding:48px 24px 72px;font-size:13px}
a{color:inherit;text-decoration:none}
button{background:none;border:0;color:inherit;font:inherit;cursor:pointer}
.wrap{max-width:960px;margin:0 auto}
@media(min-width:901px){
 .wrap{display:flex;flex-direction:column;min-height:calc(100vh - 120px)}
 .hero{margin-bottom:48px}
 .lower{margin-top:auto}
}


@keyframes rise{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fade{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:blur(0)}}
.a{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
.f{opacity:0;animation:fade .9s ease forwards;animation-delay:var(--d,0s)}
@media(prefers-reduced-motion:reduce){.a,.f{animation:none;opacity:1}}


.hero{display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:center}
#avatar{width:210px;height:auto;margin-left:14px;display:block;filter:grayscale(1)}
.hero.noav{grid-template-columns:1fr}
.id{display:flex;align-items:center;gap:26px}
.pfp{width:96px;height:96px;object-fit:cover;flex:none;border:1px solid #6b3b3b;border-radius:6px}
h1{font-size:20px;font-weight:400;color:#dcdcdc;letter-spacing:.02em;white-space:nowrap}
h1 b{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;margin-left:.35em}
.sub{margin-top:8px;font-size:12px;color:var(--dim)}
.links{display:flex;gap:14px;margin-top:12px}
.links a,.status .ic{color:#6f6f6f;transition:color .15s}
.links a:hover{color:#fff}
.ic{display:block;flex:none;background-color:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}

.links .ic{width:18px;height:18px}
.status{margin:26px 0 0 26px;display:grid;gap:9px;font-size:12px}
.status div{display:flex;align-items:center;gap:11px}
.status .ic{width:16px;height:16px}
.status i{font-style:normal;color:#6b6b6b;min-width:0;overflow-wrap:anywhere}
.status div[hidden]{display:none}
.idle{color:#b8a46a}.dnd{color:#b08585}.on{color:#8fae8f}.off{color:#555}


.lower{display:grid;grid-template-columns:1fr 1fr;gap:44px;margin-top:48px;align-items:stretch}
.right{display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.left{display:grid;min-height:240px}
.left>section{grid-area:1/1;transition:opacity .35s}
.scopes-on .quotes{opacity:0;pointer-events:none}
.left .scopesbox{opacity:0;pointer-events:none}
.scopes-on .scopesbox{opacity:1;pointer-events:auto}

.quotes{display:flex;flex-direction:column;gap:18px}
#msgs{max-height:200px;overflow-y:auto;padding-right:14px;scrollbar-width:thin;scrollbar-color:#3a3a3a transparent;
 -webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
#msgs::-webkit-scrollbar{width:2px}#msgs::-webkit-scrollbar-thumb{background:#3a3a3a}
.gb{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.gb[hidden]{display:none}
.gb input{background:transparent;border:0;border-bottom:1px solid #2a2a2a;color:var(--fg);font:inherit;font-size:12px;padding:5px 2px;outline:0;min-width:0}
.gb input:focus{border-color:#777}
.gb .nm{width:110px}.gb .tx{flex:1;min-width:130px}
.gb .hp{position:absolute;left:-9999px}
.gb button{color:#8a8a8a;font-size:12px;padding:5px 4px}.gb button:hover{color:#fff}.gb button:disabled{opacity:.4}
.gbn{width:100%;font-size:11px;color:#555;min-height:13px}
.q{margin-bottom:18px}
.q p{font-style:italic;font-size:12px;line-height:1.55;color:#bdbdbd}
.q .by{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;color:#6e6e6e}
.q .by em{width:12px;height:12px;border-radius:50%;flex:none}
.q .tr{margin-left:auto;color:#555}.q .tr:hover{color:#aaa}
.q small{display:block;margin-top:5px;font-size:11px;color:#444}

.scopesbox{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 18px;align-content:start}
.scope canvas{width:100%;height:64px;display:block}
.scope span{display:block;margin-top:6px;font-size:10px;color:#3d3d3d;letter-spacing:.08em;transition:color .15s}


.plist{position:relative;height:0;transition:opacity .3s ease,transform .3s ease}
.pli{position:absolute;left:0;right:0;bottom:14px;z-index:5;background:var(--bg);box-shadow:0 0 16px 12px var(--bg)}
.plist.closed{opacity:0;transform:translateY(8px);visibility:hidden;pointer-events:none;transition:opacity .3s ease,transform .3s ease,visibility 0s .3s}
.plist[hidden]{display:none}
.ph{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:#8a8a8a;margin-bottom:8px}
.ph b{font-weight:500;color:#bdbdbd}
.ph span{color:#555}
#list{list-style:none;max-height:206px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3a3a3a transparent}
#list::-webkit-scrollbar{width:2px}#list::-webkit-scrollbar-thumb{background:#3a3a3a}
#list li{display:grid;grid-template-columns:14px 1fr auto auto;gap:10px;align-items:center;padding:5px 4px;font-size:11px;color:#888;cursor:pointer;border-radius:3px}
#list li:hover{background:#121214;color:#ccc}
#list li.cur{color:#fff}
#list li .dot{width:6px;height:6px;border-radius:50%;background:#3a3a3a;justify-self:center}
#list li .dot i{display:none}
#list li.cur .dot{width:12px;height:10px;border-radius:0;background:none;display:flex;align-items:flex-end;justify-content:space-between}
#list li.cur .dot i{display:block;width:2px;height:100%;background:#9fbf9f;transform-origin:bottom;transform:scaleY(.35)}
.plist.playing #list li.cur .dot i{animation:eq .9s ease-in-out infinite}
.plist.playing #list li.cur .dot i:nth-child(2){animation-delay:-.45s;animation-duration:.75s}
.plist.playing #list li.cur .dot i:nth-child(3){animation-delay:-.2s;animation-duration:1.05s}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
#list li .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list li .nm i{font-style:normal;color:#555;margin-left:8px}
#list li .al{color:#4d4d4d;font-size:10px;max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list li .du{color:#666;font-variant-numeric:tabular-nums}
#list li.empty{cursor:default;color:#555;grid-template-columns:1fr}


.player{margin-top:6px}
.pin{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px}
#play{width:22px;height:22px;color:#888;flex:none}
#play:hover,.ctl button:hover{color:#fff}
#play svg{width:100%;height:100%;fill:currentColor}
.meta{flex:1;min-width:0}
.title{font-size:13px;font-weight:500;color:#d8d8d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:11px;color:#6a6a6a;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;gap:12px;color:#8a8a8a}
.ctl svg{width:15px;height:15px;fill:currentColor;display:block}
.ctl button.act{color:#fff}
.prog{display:flex;align-items:center;gap:14px;min-width:0;color:#7a7a7a;font-size:11px}
.track{flex:1;height:12px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.track div{width:100%;height:2px;background:#2a2a2a;position:relative}
.track div i{position:absolute;left:0;top:0;bottom:0;width:0;background:#9a9a9a}
.vol{display:flex;align-items:center;gap:12px;width:100%;color:#555;font-size:10px;opacity:0;overflow:hidden;pointer-events:none;transition:opacity .3s ease}
.player.on .vol{opacity:1;pointer-events:auto}
.vol svg{width:12px;height:12px;fill:currentColor;flex:none}
.vol input{flex:1;appearance:none;-webkit-appearance:none;height:2px;background:#2a2a2a;outline:0;cursor:pointer}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0}
.vol input::-moz-range-thumb{width:0;height:0;border:0}
.vol input::-moz-range-progress{background:#9a9a9a;height:2px}
.vol span{min-width:28px;text-align:right}

@media(max-width:900px){
 body{padding:28px 16px 48px}
 .hero,.lower{grid-template-columns:1fr;gap:24px}
 #avatar{margin:0 auto;width:170px}
 .id{flex-direction:column;align-items:flex-start;gap:16px}
 .status{margin-left:0}
.scope canvas{height:52px}
.scopesbox{gap:18px 14px}
}

<script>

const TRACKS=[
 {title:'Deepdive',artist:'Creo',album:'',src:'music/deepdive.mp3'},
 {title:'Natural Disaster',artist:'Enon',album:'',src:'music/natural-disaster.mp3'},
 {title:'Hall',artist:'Frums',album:'',src:'music/Hall.mp3'},
 {title:'My Kind Of Woman',artist:'Mac DeMarco',album:'',src:'music/My-Kind-Of-Woman.mp3'},
 {title:'Across The Sea (Hadashi Cover)',artist:'Hadashi',album:'',src:'music/Across-The-Sea.mp3'},
 {title:'Aegleseeker',artist:'Silentroom vs Frums',album:'',src:'music/aegleseeker.mp3'},
 {title:'Champagne Supernova',artist:'Oasis',album:'',src:'music/champagne-supernova.mp3'},
 {title:"Charlie's Inferno",artist:'That Handsome Devil',album:'',src:"music/charlies-inferno.mp3"},
 {title:'Parallel Universe Shifter',artist:'Camellia',album:'',src:'music/parallel-universe-shifter.mp3'},
 {title:'Turn The Lights Off',artist:'Tally Hall',album:'',src:'music/turn-the-lights-off.mp3'},
];
const QUOTES=[];
const DISCORD_ID='1240653971786432533';
const FB={project:'afrinatiw-site',key:'AIzaSyAg6F6qI7asv5PyQkqbZ_9apWIl3Lf5MCM'};
/* ========================= */

const $=s=>document.querySelector(s),audio=$('#audio');

/* quotes */
$('#msgs').innerHTML=QUOTES.map((q,i)=>`<div class="q"><p data-i="${i}">“${q.t}”</p><div class="by"><em style="background:${q.c}"></em>${q.by}${q.en?`<button class="tr" data-i="${i}">Translate Text</button>`:''}</div>${q.note?`<small>${q.note}</small>`:''}</div>`).join('');
$('#msgs').addEventListener('click',e=>{const b=e.target.closest('.tr');if(!b)return;const q=QUOTES[b.dataset.i],p=b.closest('.q').querySelector('p');
 const en=p.dataset.en=p.dataset.en?'':'1';p.textContent='“'+(en?q.en:q.t)+'”';b.textContent=en?'Show original':'Translate Text'});


/* guestbook (Firebase Firestore, REST) */
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
function renderMsgs(list){
 const box=$('#msgs');box.textContent='';
 if(!list.length){box.innerHTML='<div class="q"><p>no messages yet. say hi.</p></div>';return}
 for(const m of list){
  const q=document.createElement('div');q.className='q';
  const p=document.createElement('p');p.textContent='“'+m.text+'”';
  const by=document.createElement('div');by.className='by';
  const em=document.createElement('em');em.style.background='hsl('+hue(m.name)+' 25% 45%)';
  by.append(em,m.name+', '+m.date.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}));
  q.append(p,by);box.append(q);
 }
}
if(FB.project&&FB.key){
 const FS='https://firestore.googleapis.com/v1/projects/'+FB.project+'/databases/(default)/documents';
 const gb=$('#gb'),note=t=>$('#gbNote').textContent=t;
 const H={'Content-Type':'application/json'};
 const loadMsgs=async()=>{
  const r=await fetch(FS+':runQuery?key='+FB.key,{method:'POST',headers:H,body:JSON.stringify({structuredQuery:{from:[{collectionId:'messages'}],orderBy:[{field:{fieldPath:'time'},direction:'DESCENDING'}],limit:40}})});
  const rows=await r.json();
  renderMsgs(rows.filter(x=>x.document).map(x=>{const f=x.document.fields;return{name:f.name.stringValue,text:f.text.stringValue,date:new Date(f.time.timestampValue)}}));
 };
 gb.hidden=false;$('#msgs').innerHTML='<div class="q"><p>loading…</p></div>';
 loadMsgs().catch(()=>{note('could not load messages');$('#msgs').textContent=''});
 gb.addEventListener('submit',async e=>{
  e.preventDefault();if(gb.hp.value)return;
  const name=gb.nm.value.trim().slice(0,24)||'anon',text=gb.tx.value.trim().slice(0,200);
  if(!text)return;
  let last=0;try{last=+localStorage.getItem('gbt')||0}catch(_){}
  if(Date.now()-last<20000){note('wait a few seconds before sending again');return}
  $('#gbBtn').disabled=true;
  try{
   const r=await fetch(FS+'/messages?key='+FB.key,{method:'POST',headers:H,body:JSON.stringify({fields:{name:{stringValue:name},text:{stringValue:text},time:{timestampValue:new Date().toISOString()}}})});
   if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(r.status+' '+((j.error&&j.error.message)||''))}
   gb.tx.value='';try{localStorage.setItem('gbt',Date.now())}catch(_){}
   note('sent');loadMsgs().catch(()=>{});
  }catch(err){note('could not send: '+(err&&err.message?err.message:'network error'))}
  $('#gbBtn').disabled=false;
 });
}

/* discord status (Lanyard) */
const DC_TXT={online:'Online',idle:'Idle',dnd:'Do Not Disturb',offline:'Offline'},DC_CLS={online:'on',idle:'idle',dnd:'dnd',offline:'off'};
async function pollDiscord(){
 try{
  const j=await(await fetch('https://api.lanyard.rest/v1/users/'+DISCORD_ID)).json();
  if(!j.success)throw 0;
  const d=j.data,s=d.discord_status,a=(d.activities||[]).find(x=>x.type===0);
  const st=$('#dcState');st.textContent=DC_TXT[s]||s;st.className=DC_CLS[s]||'off';
  $('#dcAct').textContent=a?'Playing '+a.name:'';
  const sp=d.listening_to_spotify&&d.spotify,ss=$('#spState');
  ss.textContent=sp?'Listening to':'Not Listening to Anything';ss.className=sp?'on':'off';
  $('#spSong').textContent=sp?d.spotify.song+' · '+d.spotify.artist.replace(/;\s*/g,', '):'';
  $('#dc').hidden=false;
 }catch(_){$('#dc').hidden=true}
}
if(DISCORD_ID){pollDiscord();setInterval(pollDiscord,20000)}

/* scopes: 4 channels (drums / bass / other / vocals) */
const STEMS=['drums','bass','other','vocals'],BANDS=['low','low-mid','hi-mid','high'];
const N=4,sc=$('#scopes'),cvs=[],lbl=[];
for(let i=0;i<N;i++){sc.insertAdjacentHTML('beforeend','<div class="scope"><canvas></canvas><span></span></div>')}
sc.querySelectorAll('canvas').forEach(c=>cvs.push(c));sc.querySelectorAll('span').forEach(s=>lbl.push(s));
const lvl=new Float32Array(N),peak=new Float32Array(N).fill(.1);
let ctx,mg,anS=[],anF=[],bufs=[],raf=0,playing=false,stems=false,vlevel=.7;
/* one <audio> per stem; #audio plays the full mp3 when a song has no stems yet */
const sEls=STEMS.map(()=>{const a=new Audio();a.preload='metadata';return a});
let M=audio; /* master clock: drums stem, or the full mp3 */
function setMode(){lbl.forEach((s,i)=>s.textContent=(stems?STEMS:BANDS)[i].toUpperCase())}
setMode();

function initAudio(){
 if(ctx)return;
 ctx=new(window.AudioContext||window.webkitAudioContext)();
 mg=ctx.createGain();mg.gain.value=vlevel;mg.connect(ctx.destination);
 const mute=ctx.createGain();mute.gain.value=0;mute.connect(ctx.destination);
 const mk=el=>{const s=ctx.createMediaElementSource(el);s.connect(mg);return s};
 const sf=mk(audio),ss=sEls.map(mk),BF=[90,450,1800,6500];
 for(let i=0;i<N;i++){
  const a1=ctx.createAnalyser();a1.fftSize=1024;a1.smoothingTimeConstant=0;
  ss[i].connect(a1);a1.connect(mute);anS.push(a1);
  const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=BF[i];bp.Q.value=.9;
  const a2=ctx.createAnalyser();a2.fftSize=1024;a2.smoothingTimeConstant=0;
  sf.connect(bp);bp.connect(a2);a2.connect(mute);anF.push(a2);
  bufs.push(new Float32Array(1024));
 }
}
function frame(){
 const dpr=window.devicePixelRatio||1,ans=stems?anS:anF;let alive=false;
 for(let i=0;i<N;i++){
  const c=cvs[i],w=c.clientWidth*dpr|0,h=c.clientHeight*dpr|0;
  if(c.width!==w||c.height!==h){c.width=w;c.height=h}
  const g=c.getContext('2d'),d=bufs[i]||new Float32Array(1024);
  let rms=0;
  if(playing&&ans[i]){ans[i].getFloatTimeDomainData(d);let s=0,m=0;for(let k=0;k<d.length;k++){s+=d[k]*d[k];m=Math.max(m,Math.abs(d[k]))}
   rms=Math.sqrt(s/d.length);peak[i]=Math.max(peak[i]*.995,m,.08)}
  lvl[i]+=(rms-lvl[i])*.12;
  const act=Math.min(1,lvl[i]*45);if(lvl[i]>.0005)alive=true;
  lbl[i].style.color=`rgb(${61+act*100|0},${61+act*100|0},${61+act*100|0})`;
  g.clearRect(0,0,w,h);g.lineWidth=1.3*dpr;g.lineJoin='round';
  g.strokeStyle=`rgba(225,225,225,${.22+act*.7})`;g.beginPath();
  let st=0;if(playing&&rms>.002){for(let k=1;k<500;k++){if(d[k-1]<0&&d[k]>=0){st=k;break}}}
  const len=420,gain=.85/peak[i];
  for(let k=0;k<len;k++){
   const v=playing&&rms>.002?Math.max(-1,Math.min(1,d[st+k]*gain)):0;
   const x=k/(len-1)*w,y=h/2-v*h*.46;k?g.lineTo(x,y):g.moveTo(x,y);
  }
  g.stroke();
 }
 raf=(playing||alive)?requestAnimationFrame(frame):0;
}
const kick=()=>{if(!raf)raf=requestAnimationFrame(frame)};
frame();

/* player */
const ICON={play:'<path d="M7 4.500v15l13-7.500z"/>',pause:'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>'};
const fmt=s=>isFinite(s)&&s>0?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
let cur=0;
const dur=new Array(TRACKS.length).fill(0);

/* songs i like */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderList(){
 $('#list').innerHTML=TRACKS.length?TRACKS.map((t,i)=>`<li data-i="${i}" class="${i===cur?'cur':''}" title="${esc(t.album||'')}"><span class="dot"><i></i><i></i><i></i></span><span class="nm">${esc(t.title)}<i>${esc(t.artist)}</i></span><span class="al">${esc(t.album||'')}</span><span class="du">${dur[i]?fmt(dur[i]):''}</span></li>`).join(''):'<li class="empty">no songs yet</li>';
 const tot=dur.reduce((a,b)=>a+b,0);
 $('#plCount').textContent=TRACKS.length+' song'+(TRACKS.length===1?'':'s')+(tot?', '+Math.round(tot/60)+' min':'');
}
TRACKS.forEach((t,i)=>{const a=new Audio();a.preload='metadata';a.src=encodeURI(t.src);a.addEventListener('loadedmetadata',()=>{dur[i]=a.duration;renderList()})});
$('#list').addEventListener('click',e=>{const li=e.target.closest('li[data-i]');if(li){load(+li.dataset.i);toggle(true)}});

let token=0,ready=false,loading=Promise.resolve(),started=false;
const pauseAll=()=>{audio.pause();sEls.forEach(a=>a.pause())};
const clr=a=>{a.removeAttribute('src');a.load()};
function load(i){
 cur=(i+TRACKS.length)%TRACKS.length;const t=TRACKS[cur],my=++token;
 pauseAll();uiPause();ready=false;stems=false;M=sEls[0];
 $('#t').textContent=t.title;$('#a').textContent=t.artist+(t.album?' · '+t.album:'');
 $('#list').querySelectorAll('li[data-i]').forEach(li=>li.classList.toggle('cur',+li.dataset.i===cur));
 if('mediaSession'in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,artwork:[{src:'profile.jpg'}]});
 clr(audio);
 /* stems live in a folder named after the mp3: music/Hall.mp3 -> music/Hall/drums.mp3 ... */
 const dir=encodeURI(t.src.replace(/\.mp3$/i,''));
 loading=new Promise(res=>{
  let n=0,done=false;
  const ok=()=>{if(my!==token||done)return;if(++n<4)return;done=true;stems=true;M=sEls[0];ready=true;setMode();upd();res()};
  const bad=()=>{if(my!==token||done)return;done=true;sEls.forEach(clr);stems=false;M=audio;audio.src=encodeURI(t.src);ready=true;setMode();upd();res()};
  sEls.forEach((a,k)=>{a.preload=started?'auto':'metadata';a.onloadedmetadata=ok;a.onerror=bad;a.src=dir+'/'+STEMS[k]+'.mp3'});
 });
}
function setIco(){$('#ico').innerHTML=playing?ICON.pause:ICON.play}
async function toggle(force){
 initAudio();if(ctx.state==='suspended')ctx.resume();
 const want=force===undefined?M.paused:force;
 if(!want){pauseAll();return}
 started=true;sEls.forEach(a=>a.preload='auto');
 const my=token;
 try{
  if(!ready)await loading;
  if(my!==token)return;
  if(stems){
   const t=M.currentTime;sEls.forEach((a,k)=>{if(k&&Math.abs(a.currentTime-t)>.03)a.currentTime=t});
   await Promise.all(sEls.map(a=>a.play()));
  }else await audio.play();
 }catch(e){$('#a').textContent='play failed: '+e.name+' - '+TRACKS[cur].src}
}
function uiPlay(){$('#plist').classList.add('playing');playing=true;setIco();$('#player').classList.add('on');$('#left').classList.add('scopes-on');$('#scopeBtn').classList.add('act');kick()}
function uiPause(){$('#plist').classList.remove('playing');playing=false;setIco();$('#player').classList.remove('on');kick()}
/* events only count when they come from the current master element */
const bind=(ev,fn)=>[audio,sEls[0]].forEach(el=>el.addEventListener(ev,e=>{if(e.target===M)fn(e)}));
bind('play',uiPlay);bind('pause',uiPause);
bind('ended',()=>{pauseAll();load(cur+1);toggle(true)});
audio.addEventListener('error',()=>{if(!ready||M!==audio)return;const c=audio.error?audio.error.code:'?';const n={1:'aborted',2:'network',3:'decode error (bad/corrupt file)',4:'format not supported or file not found'}[c]||'unknown';$('#a').textContent='error '+c+' ('+n+'): '+TRACKS[cur].src});
sEls.forEach((a,k)=>a.addEventListener('error',()=>{if(!ready||!stems)return;$('#a').textContent='error in stem '+STEMS[k]+': '+TRACKS[cur].src}));
/* keep the 4 stems locked together */
setInterval(()=>{if(!stems||sEls[0].paused)return;const t=sEls[0].currentTime;for(let k=1;k<4;k++){const a=sEls[k];if(!a.paused&&Math.abs(a.currentTime-t)>.08)a.currentTime=t}},250);
const setT=t=>{if(stems)sEls.forEach(a=>a.currentTime=t);else audio.currentTime=t};
$('#play').onclick=()=>toggle();
$('#prev').onclick=()=>{if(M.currentTime>3)setT(0);else{load(cur-1);toggle(true)}};
$('#next').onclick=()=>{load(cur+1);toggle(true)};
$('#listBtn').onclick=e=>{const c=$('#plist').classList.toggle('closed');e.currentTarget.classList.toggle('act',!c);e.currentTarget.setAttribute('aria-expanded',String(!c))};
$('#scopeBtn').onclick=e=>{const on=$('#left').classList.toggle('scopes-on');e.currentTarget.classList.toggle('act',on);kick()};

/* volume (GainNode, so it also works on iOS where element.volume is ignored) */
$('#vol').addEventListener('input',e=>{vlevel=e.target.value/100;if(mg)mg.gain.value=vlevel;$('#volv').textContent=e.target.value+'%';e.target.style.background=`linear-gradient(90deg,#9a9a9a ${e.target.value}%,#2a2a2a ${e.target.value}%)`});
$('#vol').dispatchEvent(new Event('input'));

function upd(){$('#fill').style.width=(M.duration?M.currentTime/M.duration*100:0)+'%';$('#time').textContent=fmt(M.currentTime)+' / '+fmt(M.duration)}
['timeupdate','loadedmetadata','durationchange'].forEach(ev=>bind(ev,upd));
const tr=$('#track');let drag=false;
const seek=e=>{const r=tr.getBoundingClientRect();if(M.duration)setT(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*M.duration)};
tr.addEventListener('pointerdown',e=>{drag=true;tr.setPointerCapture(e.pointerId);seek(e)});
tr.addEventListener('pointermove',e=>drag&&seek(e));
tr.addEventListener('pointerup',()=>drag=false);

if('mediaSession'in navigator){const m=navigator.mediaSession;m.setActionHandler('play',()=>toggle(true));m.setActionHandler('pause',()=>toggle(false));m.setActionHandler('previoustrack',()=>$('#prev').click());m.setActionHandler('nexttrack',()=>$('#next').click())}

renderList();load(0);setIco();
</script>
</body>
</html>

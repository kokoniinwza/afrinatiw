<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tiw:~</title>
<link rel="icon" href="profile.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090a;--fg:#e6e6e6;--dim:#8a8a8a;--faint:#4d4d4d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:'JetBrains Mono',ui-monospace,monospace}
body{min-height:100vh;padding:56px 24px 80px}
a{color:inherit;text-decoration:none}
button{background:none;border:0;color:inherit;font:inherit;cursor:pointer}
.wrap{max-width:1090px;margin:0 auto}

/* hero */
.hero{display:grid;grid-template-columns:314px 1fr;gap:36px;align-items:center}
#avatar{width:256px;height:auto;margin-left:19px;display:block;filter:grayscale(1)}
.hero.noav{grid-template-columns:1fr}
.id{display:flex;align-items:center;gap:36px}
.pfp{width:131px;height:131px;border-radius:50%;object-fit:cover;flex:none;border:1px solid #6b3b3b;border-radius:6px}
h1{font-size:26px;font-weight:400;color:#dcdcdc;letter-spacing:.02em;white-space:nowrap}
h1 b{font-family:'Space Mono',monospace;font-weight:700;color:#fff;margin-left:.35em}
.sub{margin-top:10px;font-size:15px;color:var(--dim)}
.links{display:flex;gap:18px;margin-top:16px}
.links a,.status svg{color:#6f6f6f}
.links a:hover{color:#fff}
.links svg{width:22px;height:22px;fill:currentColor;display:block}
.status{margin:38px 0 0 36px;display:grid;gap:12px;font-size:14px}
.status div{display:flex;align-items:center;gap:14px}
.status svg{width:18px;height:18px;fill:currentColor;flex:none}
.status i{font-style:normal;color:#6b6b6b;min-width:0;overflow-wrap:anywhere}
.status div[hidden]{display:none}
.idle{color:#b8a46a}.dnd{color:#b08585}.on{color:#8fae8f}.off{color:#555}

/* lower */
.lower{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:64px;align-items:start}
.left{display:grid;min-height:300px}
.left>section{grid-area:1/1;transition:opacity .35s}
.scopes-on .quotes{opacity:0;pointer-events:none}
.left .scopesbox{opacity:0;pointer-events:none}
.scopes-on .scopesbox{opacity:1;pointer-events:auto}

.quotes{display:flex;flex-direction:column;gap:22px}
#msgs{max-height:236px;overflow-y:auto;padding-right:16px;scrollbar-width:thin;scrollbar-color:#3a3a3a transparent;
 -webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
#msgs::-webkit-scrollbar{width:2px}#msgs::-webkit-scrollbar-thumb{background:#3a3a3a}
.gb{display:flex;gap:10px;flex-wrap:wrap;position:relative}
.gb[hidden]{display:none}
.gb input{background:transparent;border:0;border-bottom:1px solid #2a2a2a;color:var(--fg);font:inherit;font-size:13px;padding:6px 2px;outline:0;min-width:0}
.gb input:focus{border-color:#777}
.gb .nm{width:130px}.gb .tx{flex:1;min-width:150px}
.gb .hp{position:absolute;left:-9999px}
.gb button{color:#8a8a8a;font-size:13px;padding:6px 4px}.gb button:hover{color:#fff}.gb button:disabled{opacity:.4}
.gbn{width:100%;font-size:12px;color:#555;min-height:14px}
.q{margin-bottom:24px}
.q p{font-style:italic;font-size:14px;line-height:1.55;color:#bdbdbd}
.q .by{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:#6e6e6e}
.q .by em{width:16px;height:16px;border-radius:50%;flex:none}
.q .tr{margin-left:auto;color:#555}.q .tr:hover{color:#aaa}
.q small{display:block;margin-top:6px;font-size:12px;color:#444}

.scopesbox{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 14px;align-content:start}
.scope canvas{width:100%;height:42px;display:block}
.scope span{display:block;margin-top:6px;font-size:12px;color:#3d3d3d;letter-spacing:.04em;transition:color .15s}


/* player */
.player{margin-top:6px}
.row{display:flex;align-items:center;gap:16px}
#play{width:30px;height:30px;color:#888;flex:none}
#play:hover,.ctl button:hover{color:#fff}
#play svg{width:100%;height:100%;fill:currentColor}
.meta{flex:1;min-width:0}
.title{font-size:18px;font-weight:500;color:#d8d8d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:14px;color:#6a6a6a;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;gap:16px;color:#8a8a8a;align-self:flex-start}
.ctl svg{width:20px;height:20px;fill:currentColor;display:block}
.ctl button.act{color:#fff}
.prog{display:flex;align-items:center;gap:16px;margin-top:14px;padding-left:46px;color:#7a7a7a;font-size:14px}
.track{flex:1;height:14px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.track div{width:100%;height:2px;background:#2a2a2a;position:relative}
.track div i{position:absolute;left:0;top:0;bottom:0;width:0;background:#9a9a9a}
.queue{display:none;margin:12px 0 0 46px;border-left:1px solid #2a2a2a;padding-left:12px;font-size:13px;color:#888}
.queue.show{display:block}.queue li{list-style:none;padding:3px 0;cursor:pointer}.queue li.cur{color:#fff}

@media(max-width:900px){
 body{padding:32px 18px 60px}
 .hero,.lower{grid-template-columns:1fr;gap:28px}
 #avatar{margin:0 auto;width:200px}
 .id{flex-direction:column;align-items:flex-start;gap:20px}
 .status{margin-left:0}
 .prog{padding-left:0}
}
</style>
</head>
<body>
<main class="wrap">

<section class="hero">
 <img id="avatar" src="avatar.png" alt="" onerror="this.parentNode.classList.add('noav');this.remove()">
 <div>
  <div class="id">
   <img class="pfp" src="profile.jpg" alt="profile">
   <div>
    <h1>hi, i'm <b>tiw</b></h1>
    <p class="sub">I love machine learning</p>
    <nav class="links">
     <a href="#" aria-label="discord"><svg viewBox="0 0 24 24"><path d="M5 4.6C7 3.6 9 3.2 9 3.2l.4.9c1.8-.3 3.4-.3 5.2 0l.4-.9s2 .4 4 1.4c2 3.4 3 7 2.8 11-1.6 1.2-3.2 1.9-4.600 2.300l-1-1.600c.6-.2 1.100-.5 1.600-.8l-.4-.3c-3 1.400-6.400 1.400-9.400 0l-.4.300c.5.300 1 .6 1.600.8l-1 1.600c-1.400-.4-3-1.100-4.600-2.300C2 11.600 3 8 5 4.600z"/><circle cx="9" cy="12.500" r="1.600" fill="#09090a"/><circle cx="15" cy="12.500" r="1.600" fill="#09090a"/></svg></a>
     <a href="#" aria-label="roblox"><svg viewBox="0 0 24 24"><path d="M5.200 1 1 18.800 18.800 23 23 5.200zM10.300 14.500l-.8-4.200 4.200-.8.8 4.200z"/></svg></a>
     <a href="#" aria-label="x"><svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a>
     <a href="#" aria-label="youtube"><svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.070 0 12 0 12s0 3.930.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.930 24 12 24 12s0-3.930-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg></a>
     <a href="#" aria-label="website"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2c1.900 0 3.600.800 4.800 2H7.200A8 8 0 0 1 12 4zm-6.500 4h13a8 8 0 0 1 .5 2H5a8 8 0 0 1 .5-2zM4.100 12h15.800a8 8 0 0 1-.4 2H4.500a8 8 0 0 1-.4-2zm1.400 4h13a8 8 0 0 1-2.100 2H7.600a8 8 0 0 1-2.100-2z"/></svg></a>
    </nav>
   </div>
  </div>
  <div class="status">
   <div id="dc" hidden><svg viewBox="0 0 24 24"><path d="M5 4.600C7 3.600 9 3.200 9 3.200l.4.900c1.800-.3 3.400-.3 5.200 0l.4-.9s2 .4 4 1.400c2 3.400 3 7 2.800 11-1.600 1.200-3.200 1.900-4.600 2.300l-1-1.600c.6-.2 1.100-.5 1.600-.8l-.4-.3c-3 1.400-6.400 1.400-9.400 0l-.4.3c.5.3 1 .6 1.600.8l-1 1.600c-1.400-.4-3-1.100-4.600-2.300C2 11.600 3 8 5 4.600z"/></svg><span id="dcState" class="off">Offline</span><i id="dcAct"></i></div>
   <div><svg viewBox="0 0 24 24"><path d="M12 1a11 11 0 1 0 0 22 11 11 0 0 0 0-22zm5 15.900a.7.7 0 0 1-1 .2c-2.800-1.700-6.300-2.100-10.400-1.100a.7.7 0 1 1-.3-1.400c4.500-1 8.400-.6 11.500 1.300.4.200.4.700.2 1zm1.400-3.200a.9.900 0 0 1-1.200.3c-3.200-2-8-2.500-11.800-1.400a.9.900 0 1 1-.5-1.700c4.300-1.300 9.600-.7 13.200 1.600.4.200.5.800.3 1.200zm.1-3.300C14.800 9.200 8.600 9 5 10.100a1 1 0 1 1-.6-2c4.100-1.300 11-1 15.200 1.600a1 1 0 0 1-1.100 1.700z"/></svg><span class="off" id="spState">Not Listening to Anything</span><i id="spSong"></i></div>
  </div>
 </div>
</section>

<section class="lower">
 <div class="left" id="left">
  <section class="quotes" id="quotes">
   <form class="gb" id="gb" hidden autocomplete="off">
    <input class="nm" name="nm" maxlength="24" placeholder="name (optional)" aria-label="name">
    <input class="tx" name="tx" maxlength="200" placeholder="leave a message" aria-label="message">
    <input class="hp" name="hp" tabindex="-1" aria-hidden="true">
    <button type="submit" id="gbBtn">send</button>
    <div class="gbn" id="gbNote"></div>
   </form>
   <div id="msgs"></div>
  </section>
  <section class="scopesbox" id="scopes" aria-label="oscilloscope"></section>
 </div>

 <div class="right">

  <div class="player">
   <div class="row">
    <button id="play" aria-label="play"><svg viewBox="0 0 24 24" id="ico"></svg></button>
    <div class="meta"><div class="title" id="t"></div><div class="artist" id="a"></div></div>
    <div class="ctl">
     <button id="prev" aria-label="previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.500 12z"/></svg></button>
     <button id="next" aria-label="next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l10.500 7L4 19z"/></svg></button>
     <button id="scopeBtn" aria-label="oscilloscope"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
     <button id="listBtn" aria-label="queue"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
    </div>
   </div>
   <div class="prog"><div class="track" id="track"><div><i id="fill"></i></div></div><span id="time">0:00 / 0:00</span></div>

 </div>
</section>

<audio id="audio" preload="metadata"></audio>

<script>
/* ===== แก้ตรงนี้ได้เลย ===== */
const TRACKS=[{title:'Natural Disaster',artist:'Enon',src:'music/natural-disaster.mp3'}];
const QUOTES=[
 {t:'your avatar and discord profile avatar are the same furry',by:'Peter, 2026',c:'#8a4b3a'},
 {t:'lets play fargo souls no wiki',by:'Lucifur, 2026',c:'#b8863c'},
 {t:'Правила безопасности побудили меня заговорить по-русски. Прошу прощения. [sic]',en:'The safety rules made me start speaking Russian. I apologize. [sic]',by:'GPT-4o, 2026',c:'#d8d8d8',note:'still have no idea what caused this'}
];
const DISCORD_ID='1240653971786432533';            // เลข User ID ของ Discord (ดูวิธีหาในแชท)
const FB={project:'afrinatiw-site',key:'AIzaSyAg6F6qI7asv5PyQkqbZ_9apWIl3Lf5MCM'};   // Firebase: project ID กับ Web API key (ดูวิธีในแชท)
/* ========================= */

const $=s=>document.querySelector(s),audio=$('#audio');

/* quotes */
$('#msgs').innerHTML=QUOTES.map((q,i)=>`<div class="q"><p data-i="${i}">“${q.t}”</p><div class="by"><em style="background:${q.c}"></em>${q.by}${q.en?`<button class="tr" data-i="${i}">Translate Text</button>`:''}</div>${q.note?`<small>${q.note}</small>`:''}</div>`).join('');
$('#msgs').addEventListener('click',e=>{const b=e.target.closest('.tr');if(!b)return;const q=QUOTES[b.dataset.i],p=b.closest('.q').querySelector('p');
 const en=p.dataset.en=p.dataset.en?'':'1';p.textContent='“'+(en?q.en:q.t)+'”';b.textContent=en?'Show original':'Translate Text'});


/* guestbook (Firebase Firestore, REST) */
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
function renderMsgs(list){
 const box=$('#msgs');box.textContent='';
 if(!list.length){box.innerHTML='<div class="q"><p>no messages yet. say hi.</p></div>';return}
 for(const m of list){
  const q=document.createElement('div');q.className='q';
  const p=document.createElement('p');p.textContent='\u201c'+m.text+'\u201d';
  const by=document.createElement('div');by.className='by';
  const em=document.createElement('em');em.style.background='hsl('+hue(m.name)+' 25% 45%)';
  by.append(em,m.name+', '+m.date.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}));
  q.append(p,by);box.append(q);
 }
}
if(FB.project&&FB.key){
 const FS='https://firestore.googleapis.com/v1/projects/'+FB.project+'/databases/(default)/documents';
 const gb=$('#gb'),note=t=>$('#gbNote').textContent=t;
 const H={'Content-Type':'application/json'};
 const load=async()=>{
  const r=await fetch(FS+':runQuery?key='+FB.key,{method:'POST',headers:H,body:JSON.stringify({structuredQuery:{from:[{collectionId:'messages'}],orderBy:[{field:{fieldPath:'time'},direction:'DESCENDING'}],limit:40}})});
  const rows=await r.json();
  renderMsgs(rows.filter(x=>x.document).map(x=>{const f=x.document.fields;return{name:f.name.stringValue,text:f.text.stringValue,date:new Date(f.time.timestampValue)}}));
 };
 gb.hidden=false;load().catch(()=>note('could not load messages'));
 gb.addEventListener('submit',async e=>{
  e.preventDefault();if(gb.hp.value)return;
  const name=gb.nm.value.trim().slice(0,24)||'anon',text=gb.tx.value.trim().slice(0,200);
  if(!text)return;
  let last=0;try{last=+localStorage.getItem('gbt')||0}catch(_){}
  if(Date.now()-last<20000){note('wait a few seconds before sending again');return}
  $('#gbBtn').disabled=true;
  try{
   const r=await fetch(FS+'/messages?key='+FB.key,{method:'POST',headers:H,body:JSON.stringify({fields:{name:{stringValue:name},text:{stringValue:text},time:{timestampValue:new Date().toISOString()}}})});
   if(!r.ok)throw 0;
   gb.tx.value='';try{localStorage.setItem('gbt',Date.now())}catch(_){}
   note('sent');await load();
  }catch(_){note('could not send')}
  $('#gbBtn').disabled=false;
 });
}

/* discord status (Lanyard) */
const DC_TXT={online:'Online',idle:'Idle',dnd:'Do Not Disturb',offline:'Offline'},DC_CLS={online:'on',idle:'idle',dnd:'dnd',offline:'off'};
async function pollDiscord(){
 try{
  const j=await(await fetch('https://api.lanyard.rest/v1/users/'+DISCORD_ID)).json();
  if(!j.success)throw 0;
  const d=j.data,s=d.discord_status,a=(d.activities||[]).find(x=>x.type===0);
  const st=$('#dcState');st.textContent=DC_TXT[s]||s;st.className=DC_CLS[s]||'off';
  $('#dcAct').textContent=a?'Playing '+a.name:'';
  const sp=d.listening_to_spotify&&d.spotify,ss=$('#spState');
  ss.textContent=sp?'Listening to':'Not Listening to Anything';ss.className=sp?'on':'off';
  $('#spSong').textContent=sp?d.spotify.song+' \u00b7 '+d.spotify.artist.replace(/;\s*/g,', '):'';
  $('#dc').hidden=false;
 }catch(_){$('#dc').hidden=true}
}
if(DISCORD_ID){pollDiscord();setInterval(pollDiscord,20000)}

/* scopes: PCM 1-15 */
const N=15,sc=$('#scopes'),cvs=[],lbl=[];
for(let i=0;i<N;i++){sc.insertAdjacentHTML('beforeend',`<div class="scope"><canvas></canvas><span>PCM ${i+1}</span></div>`)}
sc.querySelectorAll('canvas').forEach(c=>cvs.push(c));sc.querySelectorAll('span').forEach(s=>lbl.push(s));
const lvl=new Float32Array(N),peak=new Float32Array(N).fill(.1);
let ctx,ans=[],bufs=[],raf=0,playing=false;

function initAudio(){
 if(ctx)return;
 ctx=new(window.AudioContext||window.webkitAudioContext)();
 const src=ctx.createMediaElementSource(audio);src.connect(ctx.destination);
 const mute=ctx.createGain();mute.gain.value=0;mute.connect(ctx.destination);
 for(let i=0;i<N;i++){
  const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=50*Math.pow(200,i/(N-1));bp.Q.value=4;
  const an=ctx.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=0;
  src.connect(bp);bp.connect(an);an.connect(mute);ans.push(an);bufs.push(new Float32Array(1024));
 }
}
function frame(){
 const dpr=window.devicePixelRatio||1;let alive=false;
 for(let i=0;i<N;i++){
  const c=cvs[i],w=c.clientWidth*dpr|0,h=c.clientHeight*dpr|0;
  if(c.width!==w||c.height!==h){c.width=w;c.height=h}
  const g=c.getContext('2d'),d=bufs[i];
  let rms=0;
  if(playing&&ans[i]){ans[i].getFloatTimeDomainData(d);let s=0,m=0;for(let k=0;k<d.length;k++){s+=d[k]*d[k];m=Math.max(m,Math.abs(d[k]))}
   rms=Math.sqrt(s/d.length);peak[i]=Math.max(peak[i]*.995,m,.08)}
  lvl[i]+=(rms-lvl[i])*.12;
  const act=Math.min(1,lvl[i]*45);if(lvl[i]>.0005)alive=true;
  lbl[i].style.color=`rgb(${61+act*100|0},${61+act*100|0},${61+act*100|0})`;
  g.clearRect(0,0,w,h);g.lineWidth=1.3*dpr;g.lineJoin='round';
  g.strokeStyle=`rgba(225,225,225,${.22+act*.7})`;g.beginPath();
  let st=0;if(playing&&rms>.002){for(let k=1;k<500;k++){if(d[k-1]<0&&d[k]>=0){st=k;break}}}
  const len=420,gain=.85/peak[i];
  for(let k=0;k<len;k++){
   const v=playing&&rms>.002?Math.max(-1,Math.min(1,d[st+k]*gain)):0;
   const x=k/(len-1)*w,y=h/2-v*h*.46;k?g.lineTo(x,y):g.moveTo(x,y);
  }
  g.stroke();
 }
 raf=(playing||alive)?requestAnimationFrame(frame):0;
}
const kick=()=>{if(!raf)raf=requestAnimationFrame(frame)};
frame();

/* player */
const ICON={play:'<path d="M7 4.500v15l13-7.500z"/>',pause:'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>'};
let cur=0;
function load(i){
 cur=(i+TRACKS.length)%TRACKS.length;const t=TRACKS[cur];
 audio.src=t.src;$('#t').textContent=t.title;$('#a').textContent=t.artist;
 $('#queue').querySelectorAll('li').forEach((li,k)=>li.classList.toggle('cur',k===cur));
 if('mediaSession'in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,artwork:[{src:'profile.jpg'}]});
}
$('#queue').innerHTML=TRACKS.map((t,i)=>`<li>${t.title} — ${t.artist}</li>`).join('');
$('#queue').addEventListener('click',e=>{const li=e.target.closest('li');if(li){load([...$('#queue').children].indexOf(li));toggle(true)}});
function setIco(){$('#ico').innerHTML=playing?ICON.pause:ICON.play}
async function toggle(force){
 initAudio();if(ctx.state==='suspended')await ctx.resume();
 const want=force===undefined?audio.paused:force;
 try{want?await audio.play():audio.pause()}catch(e){$('#a').textContent='missing file: '+TRACKS[cur].src}
}
audio.addEventListener('play',()=>{playing=true;setIco();$('#left').classList.add('scopes-on');$('#scopeBtn').classList.add('act');kick()});
audio.addEventListener('pause',()=>{playing=false;setIco();kick()});
audio.addEventListener('ended',()=>{load(cur+1);toggle(true)});
audio.addEventListener('error',()=>{$('#a').textContent='missing file: '+TRACKS[cur].src});
$('#play').onclick=()=>toggle();
$('#prev').onclick=()=>{if(audio.currentTime>3)audio.currentTime=0;else{load(cur-1);toggle(true)}};
$('#next').onclick=()=>{load(cur+1);toggle(true)};
$('#scopeBtn').onclick=e=>{const on=$('#left').classList.toggle('scopes-on');e.currentTarget.classList.toggle('act',on);kick()};
$('#listBtn').onclick=()=>$('#queue').classList.toggle('show');

const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
function upd(){$('#fill').style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+'%';$('#time').textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration)}
['timeupdate','loadedmetadata','durationchange'].forEach(ev=>audio.addEventListener(ev,upd));
const tr=$('#track');let drag=false;
const seek=e=>{const r=tr.getBoundingClientRect();if(audio.duration)audio.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*audio.duration};
tr.addEventListener('pointerdown',e=>{drag=true;tr.setPointerCapture(e.pointerId);seek(e)});
tr.addEventListener('pointermove',e=>drag&&seek(e));
tr.addEventListener('pointerup',()=>drag=false);

if('mediaSession'in navigator){const m=navigator.mediaSession;m.setActionHandler('play',()=>toggle(true));m.setActionHandler('pause',()=>toggle(false));m.setActionHandler('previoustrack',()=>$('#prev').click());m.setActionHandler('nexttrack',()=>$('#next').click())}
load(0);setIco();
</script>
</body>
</html>
